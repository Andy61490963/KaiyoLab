name: Prepare homepage refinement
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'feat/home-language-and-notes' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python .github/prepare-home.py
      - name: Format and prepare an unreferenced review tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, base64, subprocess, pathlib, urllib.request
          root=pathlib.Path('.')
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          for name in ['.github/prepare-home.py','.github/workflows/prepare-home.yml']:
              pathlib.Path(name).unlink()
          subprocess.run(['git','add','-A'],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z','5b51713985a77772b09202087acf8d5c080e7453']).decode().split('\0')
          formatted=[n for n in names if pathlib.Path(n).is_file() and pathlib.Path(n).suffix in ['.astro','.ts','.css','.md']]
          subprocess.run(['npx','--no-install','prettier','--write',*formatted],check=True)
          subprocess.run(['git','add','-A'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          def post(endpoint,data):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'+endpoint,data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          elements=[]
          for name in filter(None,changed):
              entry={'path':name,'mode':'100644','type':'blob'}
              path=pathlib.Path(name)
              if not path.exists():entry['sha']=None
              else:
                  try:entry['content']=path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:entry['sha']=post('blobs',{'encoding':'base64','content':base64.b64encode(path.read_bytes()).decode()})['sha']
              elements.append(entry)
          result=post('trees',{'base_tree':tree,'tree':elements})
          pathlib.Path('/tmp/home-review-tree.json').write_text(json.dumps({'source':source,'tree':result['sha'],'changed':names},indent=2))
          subprocess.run(['tar','--exclude=.git','--exclude=node_modules','-czf','/tmp/home-review-source.tar.gz','.'],check=True)
          print('Prepared review tree:',result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: home-refinement-review
          path: |
            /tmp/home-review-tree.json
            /tmp/home-review-source.tar.gz
          retention-days: 3
