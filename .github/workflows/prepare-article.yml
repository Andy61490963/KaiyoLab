name: Prepare article reading review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'feat/article-reading-views' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python .github/prepare-article.py
      - name: Format and prepare an unreferenced review tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,subprocess,pathlib,urllib.request
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          for name in ['.github/prepare-article.py','.github/workflows/prepare-article.yml']:
              pathlib.Path(name).unlink()
          subprocess.run(['git','add','-A'],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z','babaed275a5acf4552697f9aec57e5fb1be7e2be']).decode().split('\0')
          formatted=[n for n in names if pathlib.Path(n).is_file() and pathlib.Path(n).suffix in ['.astro','.ts','.css','.md']]
          subprocess.run(['npx','--no-install','prettier','--write',*formatted],check=True)
          subprocess.run(['git','add','-A'],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          elements=[]
          for name in filter(None,changed):
              entry={'path':name,'mode':'100644','type':'blob'}
              path=pathlib.Path(name)
              if not path.exists():entry['sha']=None
              else:entry['content']=path.read_text(encoding='utf-8')
              elements.append(entry)
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':tree,'tree':elements}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as response:result=json.load(response)
          pathlib.Path('/tmp/article-review-tree.json').write_text(json.dumps({'source':source,'tree':result['sha'],'changed':names},indent=2))
          subprocess.run(['tar','--exclude=.git','--exclude=node_modules','-czf','/tmp/article-review-source.tar.gz','.'],check=True)
          print('Prepared review tree:',result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: article-reading-review
          path: |
            /tmp/article-review-tree.json
            /tmp/article-review-source.tar.gz
          retention-days: 3
