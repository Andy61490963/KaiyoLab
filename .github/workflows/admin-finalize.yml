name: Prepare admin review
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/admin-finalize.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/english-admin-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed source and prepare an unreferenced review tree
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: 2a1f30381947cc4518a39144bdfa5d0639ace130
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACM', process.env.BASE_SHA, 'HEAD'], {encoding: 'utf8'}).trim().split('\n').filter(f => /\.(tsx?|astro|css|md)$/.test(f));
          if (files.length) execFileSync('node', ['node_modules/prettier/bin/prettier.cjs', '--write', ...files], {stdio:'inherit'});
          const api = async (path, data) => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {method:'POST', headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'}, body:JSON.stringify(data)});
            if (!response.ok) throw new Error(`GitHub ${path}: ${response.status}`);
            return response.json();
          };
          const tree = [];
          for (const file of files) {
            const blob = await api('git/blobs', {content:readFileSync(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          tree.push({path:'.github/workflows/admin-finalize.yml',mode:'100644',type:'blob',sha:null});
          const baseTree = execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          const result = await api('git/trees',{base_tree:baseTree,tree});
          writeFileSync('/tmp/admin-review-tree.json', JSON.stringify({parent:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),tree:result.sha,files},null,2));
          console.log(`FORMATTED_TREE=${result.sha}`);
          execFileSync('tar',['--exclude=.git','--exclude=node_modules','-czf','/tmp/admin-formatted-source.tar.gz','.']);
          NODE
      - name: Read public deployment diagnostics without credentials
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const records=[];
          for (const path of ['/api/health','/login','/about','/api/admin/entries']) {
            try {
              const response=await fetch(`https://kaiyo.zeabur.app${path}`,{signal:AbortSignal.timeout(15000),redirect:'manual',headers:{'cache-control':'no-cache'}});
              const text=await response.text();
              records.push({path,status:response.status,location:response.headers.get('location'),body:path==='/api/health'?text.slice(0,500):undefined,newPublicLayout:text.includes('public-document'),newAdminLayout:text.includes('admin-document')});
            } catch(error) { records.push({path,error:String(error)}); }
          }
          console.log(JSON.stringify(records,null,2));
          writeFileSync('/tmp/deployment-diagnostics.json',JSON.stringify(records,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-finalized-review
          path: |
            /tmp/admin-review-tree.json
            /tmp/admin-formatted-source.tar.gz
            /tmp/deployment-diagnostics.json
          retention-days: 1
