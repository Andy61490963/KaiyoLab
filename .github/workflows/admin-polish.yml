name: Finalize admin readability
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/admin-polish.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/english-admin-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact reviewed refinements and prepare a tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          function replace(file, before, after) {
            const source=readFileSync(file,'utf8');
            if (source.split(before).length !== 2) throw new Error(`Expected one exact match in ${file}`);
            writeFileSync(file,source.replace(before,after));
          }
          const editor='src/components/admin/EntryEditor.tsx';
          replace(editor,"import type { EditorView } from '@codemirror/view';","import { EditorView } from '@codemirror/view';");
          replace(editor,'const bodyExtensions = [markdown()];','const bodyExtensions = [markdown(), EditorView.lineWrapping];');
          const css='src/styles/admin.css';
          replace(css,".admin-app :is(input:not([type='checkbox']):not([type='file']), textarea, select) {",".admin-app :where(input:not([type='checkbox']):not([type='file']), textarea, select) {");
          replace(css,'  font-size: 16px;\n  outline-offset: 2px;','  font-size: 16px;\n  font-weight: 400;\n  outline-offset: 2px;');
          const test='tests/e2e/zz-admin-ux.spec.ts';
          replace(test,"  await expect(page.locator('.admin-loading')).toHaveCount(0);","  await expect(page.locator('.admin-loading')).toHaveCount(0);\n  if (/\\/admin\\/(articles|projects)\\/[^/]+$/.test(path)) {\n    await expect(page.locator('.admin-markdown-preview')).toHaveAttribute('aria-busy', 'false');\n  }");
          replace(test,"  await page.getByRole('button', { name: 'Preview', exact: true }).click();","  expect(await page.getByLabel('Article title').evaluate((element) => parseFloat(getComputedStyle(element).fontSize))).toBeGreaterThanOrEqual(24);\n  await expect(page.locator('.cm-lineWrapping')).toBeVisible();\n  await page.getByRole('button', { name: 'Preview', exact: true }).click();\n  await expect(page.locator('.admin-prose h1')).toHaveText('Building reliable software');");
          const files=[editor,css,test];
          execFileSync('node',['node_modules/prettier/bin/prettier.cjs','--write',...files],{stdio:'inherit'});
          const api=async(path,data)=>{
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${path}`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(data)});
            if(!response.ok)throw new Error(`GitHub ${path}: ${response.status}`);
            return response.json();
          };
          const tree=[];
          for(const path of files){const blob=await api('git/blobs',{content:readFileSync(path,'utf8'),encoding:'utf-8'});tree.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          tree.push({path:'.github/workflows/admin-polish.yml',mode:'100644',type:'blob',sha:null});
          const result=await api('git/trees',{base_tree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),tree});
          const parent=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          writeFileSync('/tmp/admin-polish-tree.json',JSON.stringify({parent,tree:result.sha},null,2));
          console.log(`POLISHED_TREE=${result.sha}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: admin-polish-tree
          path: /tmp/admin-polish-tree.json
          retention-days: 1
