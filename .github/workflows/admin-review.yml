name: Admin review workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/admin-review.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked sources for offline review
        run: git archive --format=tar.gz HEAD -o /tmp/kaiyolab-review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: admin-review-source
          path: /tmp/kaiyolab-review-source.tar.gz
          retention-days: 1
